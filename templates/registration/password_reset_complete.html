
{% extends "base.html" %}

{% block title %}Password Reset Complete · TrustVault{% endblock %}

{% block content %}
<div class="loginbox">
  <div class="card">
    <h1 class="section-title">Password updated successfully</h1>

    <p class="muted">
      Your new password has been saved. You can now sign in
      using your new password.
    </p>

    <a class="btn" href="{% url 'login' %}"
       style="display:inline-block; margin-top:18px">
      Sign In
    </a>
  </div>
</div>
{% endblock %}
